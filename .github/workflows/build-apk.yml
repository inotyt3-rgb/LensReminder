name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LensReminder APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" \
              -name sdkmanager \
              -type f \
              -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          echo "Searching for project ZIP..."

          ZIP_FILE="$(find . \
            -maxdepth 2 \
            -type f \
            -name '*.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR="$(find extracted \
            -name settings.gradle.kts \
            -type f \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted \
              -name settings.gradle \
              -type f \
              -not -path '*/.gradle/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 6 -print | sort
            exit 1
          fi

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            release/LensReminder-v1.5.2-debug.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LensReminder-v1.5.2-debug
          path: ${{ env.PROJECT_DIR }}/release/LensReminder-v1.5.2-debug.apk
          if-no-files-found: error
          retention-days: 30
