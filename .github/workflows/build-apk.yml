name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LensReminder APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Gradle project
        run: |
          echo "Searching for settings.gradle.kts..."

          PROJECT_DIR="$(find . -name settings.gradle.kts -type f \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -name settings.gradle -type f \
              -not -path './.git/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
             release/LensReminder-v1.5.2-debug.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LensReminder-v1.5.2-debug
          path: ${{ env.PROJECT_DIR }}/release/LensReminder-v1.5.2-debug.apk
          if-no-files-found: error
          retention-days: 30
